services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - rum_core_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  rum_core_data:
